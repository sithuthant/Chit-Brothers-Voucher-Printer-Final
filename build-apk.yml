name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q Chit_Brothers_Voucher_Printer_App_Source.zip -d extracted
          find extracted -maxdepth 5 -name settings.gradle.kts -print

      - name: Build debug APK
        working-directory: extracted/Chit_Brothers_WiFi_Final/android-app
        run: |
          gradle --version
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chit-Brothers-Voucher-Printer-APK
          path: extracted/Chit_Brothers_WiFi_Final/android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
